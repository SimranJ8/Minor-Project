<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>To-Do List</h1>

      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a task..."
          maxlength="120"
          aria-label="To-do task"
        />
        <button type="submit">Add</button>
      </form>

      <div class="toolbar" aria-label="Task filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
